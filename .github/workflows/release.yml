# A tag like v0.2.0 builds blinker for Windows and macOS and puts the files in
# the GitHub release of that tag (made if missing):
#
#   blinker.exe          Windows
#   Blinker.dmg          macOS: opens to Blinker.app and Applications
#   Blinker-macos.zip    macOS: the same app, for the built-in updater
#
# The Mac app is signed with the certificate from scripts/macos-signing.sh,
# so users keep the Screen Recording permission across updates. Repository
# secrets:
#   BLINKER_P12_BASE64    base64 of blinker-signing.p12   (base64 -i blinker-signing.p12 | pbcopy)
#   BLINKER_P12_PASSWORD  its password
# Without them the app is signed ad hoc (a warning on the run).
#
# The release notes are the English half of the version's section of
# CHANGELOG.md. Last,
# blinker.cool/version.json gets the new version (the apps' update check).
#
# "Run workflow" by hand builds the files without releasing them.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # whisper.cpp's bindings are made with the runner's LLVM
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml says $v, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/blinker.exe
          if-no-files-found: error

  macos:
    # macOS 26 with Xcode 26: its actool builds the Liquid Glass icon
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Xcode 26's actool builds the Liquid Glass icon (assets/macos/Blinker.icon)
      - name: Newest Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version || true
      - name: Signing certificate
        env:
          BLINKER_P12_BASE64: ${{ secrets.BLINKER_P12_BASE64 }}
          BLINKER_P12_PASSWORD: ${{ secrets.BLINKER_P12_PASSWORD }}
        run: |
          if [ -z "$BLINKER_P12_BASE64" ]; then
            echo "::warning::no BLINKER_P12_BASE64 secret: the app is signed ad hoc and users allow screen recording again after every update"
            exit 0
          fi
          printf '%s' "$BLINKER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/blinker-signing.p12"
          scripts/macos-signing.sh import "$RUNNER_TEMP/blinker-signing.p12"
          rm -f "$RUNNER_TEMP/blinker-signing.p12"
      # dmgbuild's venv on a released Python: the runner's newest one may
      # come without a working pip (3.15's ensurepip failed on v0.4.1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: UNIVERSAL=1 scripts/macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/release/Blinker.dmg
            target/release/Blinker-macos.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          # the lines under "## <version>" up to the next "## "
          awk -v v="$v" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > section.md
          # the English half (after "---"); a section in one language as it is
          if grep -qx -- '---' section.md; then
            awk 'f; /^---$/ { f = 1 }' section.md > notes.md
          else
            cp section.md notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $v"
            exit 1
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "blinker ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      # the apps ask blinker.cool/version.json whether there is a newer version
      - name: version.json on the site
        env:
          SITE_SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          SITE_HOST: ${{ secrets.SITE_HOST }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import json, os
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          assets = {n: {"url": f"{base}/{n}", "size": os.path.getsize(f"dist/{n}")} for n in sorted(os.listdir("dist"))}
          json.dump({"version": tag.lstrip("v"), "tag": tag, "notes": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}", "assets": assets}, open("version.json", "w"), indent=2)
          PY
          cat version.json
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SITE_SSH_KEY" > ~/.ssh/site
          chmod 600 ~/.ssh/site
          printf '%s\n' "$SITE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -t -e "ssh -i $HOME/.ssh/site -o IdentitiesOnly=yes -o BatchMode=yes" version.json "blinker-deploy@$SITE_HOST:/"
          rm -f ~/.ssh/site

  # A note in blinker's Discord channel: the release is out, or what broke.
  # Repository secret DISCORD_BOT_TOKEN: the bot's token (it must be able to
  # post in the channel). Without it the note is skipped.
  discord:
    needs: [windows, macos, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL: "1563174255905083504"
          WIN: ${{ needs.windows.result }}
          MAC: ${{ needs.macos.result }}
          REL: ${{ needs.release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "no DISCORD_BOT_TOKEN secret: no note"
            exit 0
          fi
          python3 .github/scripts/discord_note.py > body.json
          curl -fsS -X POST "https://discord.com/api/v10/channels/$CHANNEL/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" \
            --data @body.json > /dev/null
