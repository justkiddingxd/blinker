[package]
name = "blinker"
version = "0.4.4"
edition = "2024"
description = "Fast, quiet screenshot and screen recording tool for Windows and macOS"
license = "GPL-3.0-only"
repository = "https://github.com/justkiddingxd/blinker"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
color_quant = "1.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
gif = "0.14.2"
drag = "2.1.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
raw-window-handle = "0.6.2"
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
# unpacks the downloaded ffmpeg (.gz)
flate2 = "1.1.10"
tiny-skia = "0.12.0"
# speech to subtitles in the video editor (whisper.cpp, on this computer)
whisper-rs = "0.16.0"
# QR codes on the screen while selecting
rqrr = "0.10"
# QR codes on the screen: ZXing ported to Rust, finds small, colored and tilted ones
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
# checks the downloaded speech model
sha2 = "0.10.9"
toml = "1.1.8"
# ShareX settings backups (.sxb) are zip files
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# makes a QR picture for the scanner's test
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    # "recognize text": PaddleOCR's models run by Windows ML
    "AI_MachineLearning",
] }
windows-numerics = "0.3.1"
windows-collections = "0.3.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Networking_WinHttp",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_Security",
] }

[build-dependencies]
# compiles the Objective-C layer of the macOS build (unused on Windows)
cc = "1.2.30"
# the icon and version info of blinker.exe
embed-resource = "3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
# settings and history drawn with Metal (OpenGL stops at 60 Hz on a Mac)
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }
# the same winit eframe uses: macOS event loop options (activation policy, menu)
winit = { version = "0.30.13", default-features = false }
# MP3 when a clip is saved as sound only (Windows has an MP3 encoder built in)
mp3lame-encoder = "0.2.5"

# Image codecs are painfully slow unoptimized; keep deps fast even in debug.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
