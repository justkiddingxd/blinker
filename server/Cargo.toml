[package]
name = "blinker-post"
version = "0.1.0"
edition = "2024"
description = "The server behind post.blinker.cool: takes files from blinker and shows them for a few days"
license = "GPL-3.0-only"
repository = "https://github.com/justkiddingxd/blinker"

[dependencies]
axum = "0.8.9"
getrandom = "0.3.4"
mime = "0.3.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.6", features = ["fs"] }

[profile.release]
opt-level = 3
strip = true
